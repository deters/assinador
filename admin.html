<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Assinaturas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">
    <div class="max-w-6xl w-full bg-white rounded-lg shadow-md p-6">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 space-y-4 md:space-y-0">
            <h1 class="text-2xl font-bold text-gray-800">Painel de Administração de Assinaturas</h1>
            <div class="flex space-x-4">
                <a href="download_tar" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors">
                    Baixar Todas (TAR)
                </a>
                <button id="resetBtn" class="px-4 py-2 bg-red-600 text-white font-semibold rounded-md hover:bg-red-700 transition-colors">
                    Resetar Base
                </button>
            </div>
        </div>

        <div id="loading" class="text-center text-gray-500 my-8">
            Carregando assinaturas...
        </div>

        <div id="error" class="hidden text-center text-red-500 my-8">
            Erro ao carregar assinaturas.
        </div>

        <div id="emptyState" class="hidden text-center text-gray-500 my-8">
            Nenhuma assinatura encontrada.
        </div>

        <div id="signaturesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- As assinaturas serão inseridas aqui dinamicamente -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('signaturesGrid');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const emptyState = document.getElementById('emptyState');
            const resetBtn = document.getElementById('resetBtn');

            resetBtn.addEventListener('click', () => {
                if (confirm('Tem certeza que deseja apagar todas as assinaturas e resetar a base de dados? Esta ação não pode ser desfeita.')) {
                    fetch('api/reset', { method: 'POST' })
                        .then(response => {
                            if (response.ok) {
                                alert('Base resetada com sucesso.');
                                window.location.reload();
                            } else {
                                alert('Erro ao resetar a base.');
                            }
                        })
                        .catch(error => {
                            console.error('Erro:', error);
                            alert('Erro de conexão ao resetar a base.');
                        });
                }
            });

            fetch('api/signatures')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erro na rede');
                    }
                    return response.json();
                })
                .then(data => {
                    loading.classList.add('hidden');

                    if (data.status === 'success') {
                        const signatures = data.signatures;

                        if (!signatures || signatures.length === 0) {
                            emptyState.classList.remove('hidden');
                            return;
                        }

                        signatures.forEach(sig => {
                            const date = new Date(sig.timestamp * 1000);
                            const dataHora = date.toLocaleString('pt-BR');

                            const card = document.createElement('div');
                            card.className = 'border border-gray-200 rounded-lg p-4 bg-gray-50 flex flex-col items-center shadow-sm';

                            const img = document.createElement('img');
                            img.src = 'uploads/' + sig.filename;
                            img.alt = 'Assinatura ' + sig.matricula;
                            img.className = 'w-full h-auto object-contain bg-white border border-gray-300 rounded mb-3';
                            img.style.maxHeight = '150px';

                            const infoContainer = document.createElement('div');
                            infoContainer.className = 'w-full text-sm text-gray-700 space-y-1';

                            const matriculaEl = document.createElement('p');
                            const matriculaStrong = document.createElement('strong');
                            matriculaStrong.textContent = 'Matrícula: ';
                            matriculaEl.appendChild(matriculaStrong);
                            matriculaEl.appendChild(document.createTextNode(sig.matricula));

                            const nomeEl = document.createElement('p');
                            const nomeStrong = document.createElement('strong');
                            nomeStrong.textContent = 'Nome: ';
                            nomeEl.appendChild(nomeStrong);
                            nomeEl.appendChild(document.createTextNode(sig.nome));

                            const dataEl = document.createElement('p');
                            const dataStrong = document.createElement('strong');
                            dataStrong.textContent = 'Data: ';
                            dataEl.appendChild(dataStrong);
                            dataEl.appendChild(document.createTextNode(dataHora || 'N/A'));

                            infoContainer.appendChild(matriculaEl);
                            infoContainer.appendChild(nomeEl);
                            infoContainer.appendChild(dataEl);

                            const deleteBtn = document.createElement('button');
                            deleteBtn.textContent = 'Excluir';
                            deleteBtn.className = 'w-full mt-3 px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition-colors font-semibold';
                            deleteBtn.addEventListener('click', () => {
                                if (confirm('Tem certeza que deseja excluir esta assinatura?')) {
                                    fetch('api/delete', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify({ matricula: sig.matricula })
                                    })
                                    .then(response => response.json())
                                    .then(result => {
                                        if (result.status === 'success') {
                                            card.remove();
                                            if (grid.children.length === 0) {
                                                emptyState.classList.remove('hidden');
                                            }
                                        } else {
                                            alert('Erro ao excluir: ' + (result.message || 'Desconhecido'));
                                        }
                                    })
                                    .catch(err => {
                                        console.error('Erro na exclusão:', err);
                                        alert('Erro de conexão ao excluir.');
                                    });
                                }
                            });

                            card.appendChild(img);
                            card.appendChild(infoContainer);
                            card.appendChild(deleteBtn);

                            grid.appendChild(card);
                        });
                    } else {
                        throw new Error(data.message || 'Erro desconhecido');
                    }
                })
                .catch(error => {
                    console.error('Erro ao buscar assinaturas:', error);
                    loading.classList.add('hidden');
                    errorDiv.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
