<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleta de Assinaturas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">
    <div class="max-w-2xl w-full bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Coleta de Assinatura</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label for="employeeId" class="block text-sm font-medium text-gray-700 mb-1">Matrícula</label>
                <input type="text" id="employeeId" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Digite a matrícula">
            </div>
            <div>
                <label for="employeeName" class="block text-sm font-medium text-gray-700 mb-1">Nome do Funcionário</label>
                <input type="text" id="employeeName" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Digite o nome completo">
            </div>
        </div>

        <div id="warningMessage" class="text-red-500 text-sm mb-4 font-semibold text-center">
            Por favor, informe a matrícula e o nome para habilitar a captura da assinatura.
        </div>

        <div id="captureSection" class="opacity-50 pointer-events-none transition-opacity duration-300">
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-2 text-gray-700">Opção 1: Assinar na Tela</h2>
            <div class="border-2 border-dashed border-gray-300 rounded-md bg-gray-50 relative h-64 w-full touch-none" id="canvasContainer">
                <canvas id="signaturePad" class="absolute top-0 left-0 w-full h-full rounded-md"></canvas>
            </div>
            <div class="flex justify-end mt-2 space-x-2">
                <button id="clearBtn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors">Limpar</button>
            </div>
        </div>

        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-2 text-gray-700">Opção 2: Foto do Papel</h2>
            <p class="text-sm text-gray-500 mb-2">Tire uma foto ou faça upload da assinatura em um papel branco.</p>
            <input type="file" id="imageUpload" accept="image/*" capture="environment" class="w-full border border-gray-300 p-2 rounded-md mb-2 bg-white">

            <div id="imagePreviewContainer" class="hidden mt-2 border border-gray-300 rounded-md p-4 bg-gray-50">
                <canvas id="previewCanvas" class="w-full max-h-48 object-contain mb-2 border border-gray-200 bg-white hidden"></canvas>
                <p class="text-sm font-medium text-gray-700 mb-1">Ajuste de Extração (Limiar)</p>
                <input type="range" id="thresholdSlider" min="0" max="255" value="128" class="w-full mb-4">
                <button id="extractBtn" class="w-full px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors">Aplicar no Canvas Principal</button>
            </div>
        </div>

            <div class="border-t pt-4">
                <button id="saveBtn" class="w-full px-4 py-3 bg-green-600 text-white font-bold rounded-md hover:bg-green-700 transition-colors text-lg">
                    Salvar e Enviar
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
